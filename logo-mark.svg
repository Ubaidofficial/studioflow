<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- StudioFlow 2026 Midnight Substratum -->
    <linearGradient id="sf-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Top Track: Cyan to Royal Blue -->
    <linearGradient id="sf-track-top" x1="20" y1="20" x2="80" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Bottom Track: Royal Blue to Vibrant Violet -->
    <linearGradient id="sf-track-bottom" x1="20" y1="50" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Elevation Glow -->
    <filter id="sf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#sf-bg)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#sf-glow)"/>

  <!-- Top Pill Track -->
  <path d="M 72 35 C 72 26.7 65.3 20 57 20 L 39 20 C 30.7 20 24 26.7 24 35 C 24 43.3 30.7 50 39 50 L 61 50" 
        stroke="url(#sf-track-top)" stroke-width="10" stroke-linecap="round"/>

  <!-- Bottom Pill Track -->
  <path d="M 28 65 C 28 73.3 34.7 80 43 80 L 61 80 C 69.3 80 76 73.3 76 65 C 76 56.7 69.3 50 61 50 L 39 50" 
        stroke="url(#sf-track-bottom)" stroke-width="10" stroke-linecap="round"/>

  <!-- Center Optical Recording Iris / Play Dot -->
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF"/>
</svg>
