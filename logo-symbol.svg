<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Top Track: Electric Cyan to Royal Blue -->
    <linearGradient id="sf-sym-top" x1="20" y1="20" x2="80" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Bottom Track: Royal Blue to Violet -->
    <linearGradient id="sf-sym-bottom" x1="20" y1="50" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Top Pill Track -->
  <path d="M 72 35 C 72 26.7 65.3 20 57 20 L 39 20 C 30.7 20 24 26.7 24 35 C 24 43.3 30.7 50 39 50 L 61 50" 
        stroke="url(#sf-sym-top)" stroke-width="10" stroke-linecap="round"/>

  <!-- Bottom Pill Track -->
  <path d="M 28 65 C 28 73.3 34.7 80 43 80 L 61 80 C 69.3 80 76 73.3 76 65 C 76 56.7 69.3 50 61 50 L 39 50" 
        stroke="url(#sf-sym-bottom)" stroke-width="10" stroke-linecap="round"/>

  <!-- Center Optical Recording Iris / Play Dot -->
  <circle cx="50" cy="50" r="4.5" fill="#38BDF8"/>
</svg>
